name: Claude review

# A final, read-only Claude review of a ResumeRadar pull request (Shola, 19 Nov
# 2026, first copied from the D-Care and Bachel review workflows). Each review
# costs about $1 to $3, so it is kept for level 2 and 3 pull requests.
#
# It calls the Claude API directly (.github/scripts/claude_review.py) rather
# than the Claude Code GitHub Action, because the Max plan's monthly API credit
# covers the Claude API but not Claude Code: Anthropic says runs started by the
# Claude Code GitHub Action count as Claude Code usage
# (support.claude.com/en/articles/17154008, checked 19 Nov 2026).
# It runs only on a comment that starts with "@claude-qa review" from Shola's
# account: typed by him, or posted by a project thread through the Claude
# GitHub app. Never on its own.
#
# The review follows .claude/skills/resumeradar-final-review/SKILL.md from the
# default branch, never from the pull request, so a change can't rewrite the
# rules it is checked against. The pull request's code is checked out beside it
# at pr-head/.
#
# Claude reads untrusted text (the diff, the PR body and comments), so its only
# tools are list, read and search, confined to pr-head/ and .review/. It has no
# shell, git, network or file writes, and the script and checklist come from
# the default branch, never from the pull request. It can't post anything
# itself: the script saves its review, and a later step that Claude doesn't
# control checks the text for secrets and posts it.
#
# No API key is stored. The script authenticates with workload identity
# federation: it swaps this job's GitHub OIDC token for a short-lived Claude
# token. The Claude Console rule (resumeradar-claude-review,
# fdrl_01Rz7KhZyfUoJqm786YiqFBd) only accepts this
# file on the default branch, for an issue_comment, and mints tokens for the
# "ResumeRadar GitHub reviews" workspace, which has a monthly spend limit ($60, raised 20 Nov 2026). The
# IDs below are identifiers, not secrets. If the review fails (rule mismatch,
# spend limit reached, timeout, no verdict), the job says so.
#
# Comments that trigger this workflow always use the workflow on the default
# branch, so the first real run is after merge.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    name: Claude review
    # 123071861 is Shola's GitHub account (sholaola23); the id survives a rename.
    # The comment must come from his account, either typed by him or posted
    # through the Claude GitHub app (app id 1236702), which project build
    # threads use. A comment posted through any other app never starts a run
    # (Grok replies from its own bot account through the Cursor app), and nor
    # does a comment that only mentions the phrase. The monthly limit on the
    # "ResumeRadar GitHub reviews" workspace caps what repeated requests can
    # cost.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude-qa review') &&
      github.event.comment.user.id == 123071861 &&
      (github.event.comment.performed_via_github_app == null ||
       github.event.comment.performed_via_github_app.id == 1236702)
    # Inside the job, so other comments on the pull request never join the
    # group and can't cancel a queued review.
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      # Lets the script ask GitHub for this job's OIDC token (federation).
      id-token: write
    env:
      PR: ${{ github.event.issue.number }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prepare the pull request for review
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Credentials go on this one command only; nothing is saved to disk.
          # --unshallow brings the history needed to find the merge base.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          branch="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --unshallow --no-tags origin \
            "+refs/pull/$PR/head:refs/review/head" "+refs/heads/$branch:refs/review/base"
          base="$(git rev-parse refs/review/base)"
          head="$(git rev-parse refs/review/head)"
          git worktree add --detach pr-head "$head"
          # The pull request's own Claude settings and CLAUDE.md files could
          # steer its review, so they go before Claude starts.
          rm -rf pr-head/.claude
          find pr-head -name CLAUDE.md -type f -delete

          # Claude has no shell, git or GitHub CLI, and can't read outside the
          # workspace, so everything it needs is saved in .review/.
          mkdir -p .review
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json title,body,comments > .review/pr-context.json
          git diff "$base...$head" > .review/diff.patch
          git diff --name-status "$base...$head" > .review/files.txt
          git log --format='%H %s' "$base..$head" > .review/commits.txt
          # Earlier Claude reviews: their count, and from the fourth review on,
          # the changes since the last reviewed commit if it still exists.
          jq -r '[.comments[] | select(.author.login == "github-actions")
                  | .body | sub("\\s+$"; "") | split("\n") | last
                  | select(test("^CLAUDE-QA: (PASS|CHANGES NEEDED) @ [0-9a-f]{40}$"))
                  | split(" @ ") | last]
                 | "\(length) \(last // "")"' .review/pr-context.json > .review/previous.txt
          read -r count last < .review/previous.txt
          if [ "$count" -ge 3 ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            git diff "$last" "$head" > .review/since-last.patch
          fi
          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Review
        id: review
        env:
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01Rz7KhZyfUoJqm786YiqFBd
          ANTHROPIC_ORGANIZATION_ID: e53a9ad2-0c54-4729-96ef-88cd3a72d7f0
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01NwcfWaZLNTbuSKRAMNiPUX
          ANTHROPIC_WORKSPACE_ID: wrkspc_01CVogoTepaBZs1G5ABVxoTc
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          SKILL: .claude/skills/resumeradar-final-review/SKILL.md
        run: |
          # The SDK is pinned and installed outside the workspace, so Claude's
          # read tools never see it. No GitHub token is passed to this step.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet anthropic==2.6.0
          REVIEW_OUT="$RUNNER_TEMP/review.md" "$RUNNER_TEMP/venv/bin/python" .github/scripts/claude_review.py

      - name: Post the review
        if: steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: |
          body="$RUNNER_TEMP/review.md"
          # A missing file gives an empty review, which the verdict check below
          # reports on the pull request.
          [ -f "$body" ] || : > "$body"
          # Never post anything that carries a key or a token, whatever the
          # review text says.
          if grep -qF -- "$GH_TOKEN" "$body" ||
             grep -qE 'sk-ant-[A-Za-z0-9_-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}' "$body"; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
              "Claude review not posted: its text contained something that looks like a secret, so it was withheld. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 1
          fi
          # The verdict must be the review's last non-empty line.
          verdict="$(grep -v '^[[:space:]]*$' "$body" | tail -n 1 || true)"
          if ! printf '%s\n' "$verdict" | grep -qxE "CLAUDE-QA: (PASS|CHANGES NEEDED) @ $HEAD"; then
            # Still show what the review said (it passed the secret check
            # above), so the cause is visible. It is wrapped so it never counts:
            # the comment's last line is not a verdict line, and earlier
            # reviews are only read from their last line.
            if ! grep -q '[^[:space:]]' "$body"; then
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
                "Claude review finished with no text for $HEAD, so there is no verdict. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              exit 1
            fi
            note="$RUNNER_TEMP/no-verdict.md"
            {
              echo "Claude review finished without a valid verdict line for $HEAD, so this review does not count. Its text is below so the cause can be seen. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo '<details><summary>Review text</summary>'
              echo
              echo '````text'
              head -c 60000 "$body"
              echo
              echo '````'
              echo
              echo '</details>'
              echo
              echo "No valid verdict for $HEAD."
            } > "$note"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$note"
            exit 1
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Say so on the pull request if the review failed
        # The posting step comments on its own failures; this covers the rest.
        if: failure() && steps.review.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
            "Claude review failed before it could finish (for example the federation rule did not match, the workspace spend limit was reached, or a timeout). Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
