name: CI

# Checks that run on every pull request and on every push to master (Shola,
# 20 Nov 2026). Before this, pull requests showed no checks at all.
#
# Two jobs:
# - Secret scan: gitleaks over the whole git history. A finding fails the job.
#   Known findings that are confirmed dead live in .gitleaksignore.
# - Tests: the QA suite, every Python unittest in tests/ and the node tests,
#   the same commands as "How to verify" in the project instructions.
#
# No secrets or keys are used. The tests run with no ANTHROPIC_API_KEY, Redis,
# Resend or Stripe keys, so they never call a paid API or send anything.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.28.0
      # From gitleaks_8.28.0_checksums.txt on the v8.28.0 release.
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz

      - name: Scan git history
        # --redact keeps any secret it finds out of the job log.
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1'

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Install redis-server
        # tests/test_repeat_downloads.py starts its own private Redis on a Unix
        # socket, so it needs the binary, not a Redis service.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server

      - name: QA suite
        # Prints "ALL CLEAR" and exits 0 only when every check passes.
        run: python tests/qa_suite.py

      - name: Python unittests
        # Run even if an earlier group failed, so one run shows every failure.
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Node tests
        if: ${{ !cancelled() }}
        run: node --test tests/scan_utils.test.cjs
